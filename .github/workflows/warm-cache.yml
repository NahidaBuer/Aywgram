name: Warm CI caches

on:
  workflow_dispatch:
    inputs:
      target:
        description: Platform to warm; all covers the three automatic release platforms.
        required: true
        default: all
        type: choice
        options:
          - all
          - linux-x86_64
          - mac-arm64
          - windows-arm64
          - windows-x86_64

permissions:
  contents: write
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Require the default branch.
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo '::error::Run cache warming from the default branch.'
            exit 1
          fi

  linux:
    needs: validate
    if: inputs.target == 'all' || inputs.target == 'linux-x86_64'
    uses: ./.github/workflows/linux.yml
    with:
      warm_cache: true
      notify: false
    secrets: inherit

  mac:
    needs: validate
    if: inputs.target == 'all' || inputs.target == 'mac-arm64'
    uses: ./.github/workflows/mac.yml
    with:
      arch: arm64
      warm_cache: true
      notify: false
    secrets: inherit

  windows:
    needs: validate
    if: inputs.target == 'all' || startsWith(inputs.target, 'windows-')
    uses: ./.github/workflows/win.yml
    with:
      arch: ${{ inputs.target == 'windows-x86_64' && 'x64' || 'arm64' }}
      warm_cache: true
      notify: false
    secrets: inherit
