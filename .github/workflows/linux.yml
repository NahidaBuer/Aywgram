name: Linux.

on:
  workflow_call:
    inputs:
      source_sha:
        description: Validated release commit supplied by the prerelease coordinator.
        required: false
        default: ''
        type: string
      warm_cache:
        description: Build caches only on the default branch; do not distribute artifacts.
        required: false
        default: false
        type: boolean
      compiler_cache:
        description: Enable application compiler caching.
        required: false
        default: true
        type: boolean
      distribute:
        required: false
        default: false
        type: boolean
      release_tag:
        required: false
        default: ''
        type: string
      notify:
        required: false
        default: true
        type: boolean
      update_metadata:
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      warm_cache:
        description: Build caches only on the default branch; do not distribute artifacts.
        required: false
        default: false
        type: boolean
      compiler_cache:
        description: Enable application compiler caching.
        required: false
        default: true
        type: boolean
      distribute:
        description: Upload to an existing prerelease and notify Telegram.
        required: true
        default: false
        type: boolean
      release_tag:
        description: Existing prerelease tag; required when distribute is enabled.
        required: false
        type: string
      notify:
        description: Notify the Telegram channel after uploading.
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  actions: read

defaults:
  run:
    shell: bash

jobs:

  validate-distribution:
    name: Validate distribution target
    runs-on: ubuntu-latest

    steps:
      - name: Validate cache mode.
        shell: bash
        env:
          WARM_CACHE: ${{ inputs.warm_cache }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          DISTRIBUTE: ${{ inputs.distribute }}
          UPDATE_METADATA: ${{ inputs.update_metadata }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ "$WARM_CACHE" = true ]; then
            if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ] \
              || [ "$DISTRIBUTE" = true ] || [ "$UPDATE_METADATA" = true ] \
              || [ -n "$RELEASE_TAG" ] || [ -n "$SOURCE_SHA" ]; then
              echo '::error::Cache warming requires the default branch, no release_tag/source_sha and no distribution or metadata update.'
              exit 1
            fi
          fi

      - name: Validate release and secrets.
        if: ${{ inputs.distribute == true && inputs.warm_cache != true }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          NOTIFY_TELEGRAM: ${{ inputs.notify }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_TAG" ]; then
            echo '::error::release_tag is required when distribute is enabled.'
            exit 1
          fi
          if [ "$NOTIFY_TELEGRAM" = true ] \
            && { [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHANNEL_ID" ]; }; then
            echo '::error::Configure TELEGRAM_BOT_TOKEN and TELEGRAM_CHANNEL_ID repository secrets.'
            exit 1
          fi
          release_state="$(
            gh release view "$RELEASE_TAG" \
              --repo "$GH_REPO" \
              --json isDraft,isPrerelease \
              --jq '.isDraft or .isPrerelease'
          )"
          if [ "$release_state" != true ]; then
            echo "::error::Release $RELEASE_TAG is neither draft nor prerelease."
            exit 1
          fi

  linux:
    name: Rocky Linux 8
    runs-on: ubuntu-latest
    needs: validate-distribution
    concurrency:
      group: ${{ inputs.warm_cache && 'warm-cache-linux-x86_64' || format('linux-{0}-{1}', github.run_id, github.run_attempt) }}
      cancel-in-progress: false

    env:
      UPLOAD_ARTIFACT: ${{ inputs.warm_cache && 'false' || 'true' }}
      IMAGE_TAG: tdesktop:centos_env
      CCACHE_MAXSIZE: '1Gi'
      CACHE_DANCE_REVISION: 5422eac04292c961a382e0f584ea0f03ad9da723
      API_ID: ${{ secrets.API_ID }}
      API_HASH: ${{ secrets.API_HASH }}

    steps:
      - name: Clone.
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.warm_cache && github.sha || inputs.source_sha || inputs.release_tag || github.ref }}
          submodules: recursive

      - name: Resolve release version.
        id: release_version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 .github/scripts/release_version.py --tag "$RELEASE_TAG" --apply --github-output "$GITHUB_OUTPUT"

      - name: First set up.
        run: |
          sudo apt update
          curl -sSL https://install.python-poetry.org | python3 -
          python3 .github/scripts/ci_cache.py install linux-x86_64
          cd Telegram/build/docker/centos_env
          poetry install
          DOCKERFILE=$(DEBUG='' LTO='' poetry run gen_dockerfile)
          echo "$DOCKERFILE" > Dockerfile
          rm -rf __pycache__

      - name: Compute cache keys.
        id: cache-key
        run: python3 .github/scripts/ci_cache.py keys linux x86_64

      - name: Free up some disk space.
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true

      - name: Set up Docker Buildx.
        id: setup-buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up cache-dance runtime.
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Fetch cache-dance CLI.
        run: |
          mkdir -p out/ci-tools
          curl --fail --show-error --location --retry 3 \
            "https://raw.githubusercontent.com/reproducible-containers/buildkit-cache-dance/$CACHE_DANCE_REVISION/dist/index.js" \
            --output out/ci-tools/cache-dance.js

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/.buildx-cache
          key: ${{ steps.cache-key.outputs.prefix }}-layers-${{ steps.cache-key.outputs.dependencies }}

      - name: Docker mounts cache.
        id: cache-mounts
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/.mount-cache
          key: ${{ steps.cache-key.outputs.prefix }}-mounts-${{ steps.cache-key.outputs.dependencies }}

      - name: Inject Docker cache mounts.
        env:
          BUILDER: ${{ steps.setup-buildx.outputs.name }}
        run: |
          python3 .github/scripts/ci_cache.py mark dependencies
          node out/ci-tools/cache-dance.js \
            --builder "$BUILDER" --cache-dir "$RUNNER_TEMP/.mount-cache" \
            --scratch-dir "$RUNNER_TEMP/cache-dance" \
            --dockerfile Telegram/build/docker/centos_env/Dockerfile

      - name: Libraries.
        id: libraries
        uses: docker/build-push-action@v7
        with:
          context: Telegram/build/docker/centos_env
          load: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=local,src=${{ runner.temp }}/.buildx-cache
          cache-to: type=local,dest=${{ runner.temp }}/.buildx-cache-new,mode=max

      - name: Move cache.
        run: |
          rm -rf ${{ runner.temp }}/.buildx-cache
          mv ${{ runner.temp }}/.buildx-cache{-new,}

      - name: Export Docker cache mounts.
        id: export-mounts
        continue-on-error: true
        env:
          BUILDER: ${{ steps.setup-buildx.outputs.name }}
        run: |
          node out/ci-tools/cache-dance.js --extract \
            --builder "$BUILDER" --cache-dir "$RUNNER_TEMP/.mount-cache" \
            --scratch-dir "$RUNNER_TEMP/cache-dance" \
            --dockerfile Telegram/build/docker/centos_env/Dockerfile
          if [ -d "$RUNNER_TEMP/.mount-cache/var/cache/ccache" ]; then
            CCACHE_DIR="$RUNNER_TEMP/.mount-cache/var/cache/ccache" ccache --max-size 1Gi --cleanup
          fi
          python3 .github/scripts/ci_cache.py mark dependencies --end

      - name: Save libraries cache.
        if: steps.cache-libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/.buildx-cache
          key: ${{ steps.cache-libs.outputs.cache-primary-key }}

      - name: Save Docker mounts cache.
        if: steps.cache-mounts.outputs.cache-hit != 'true' && steps.export-mounts.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/.mount-cache
          key: ${{ steps.cache-mounts.outputs.cache-primary-key }}

      - name: Restore application compiler cache.
        id: cache-app
        if: inputs.compiler_cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.cache-key.outputs.app-key }}
          restore-keys: ${{ steps.cache-key.outputs.app-prefix }}

      - name: Start application timer.
        shell: bash
        run: python3 .github/scripts/ci_cache.py mark application

      - name: Reset compiler cache statistics.
        id: cache-reset
        if: inputs.compiler_cache
        shell: bash
        run: ccache --zero-stats

      - name: Telegram Desktop build.
        env:
          COMPILER_CACHE: ${{ inputs.compiler_cache }}
        run: |
          CACHE_ENV=(-u CCACHE_DISABLE)
          if [ "$COMPILER_CACHE" != true ]; then
            CACHE_ENV=(CCACHE_DISABLE=1)
          fi

          API_ARGS=(-D TDESKTOP_API_TEST=ON)
          if [ -n "$API_ID" ] && [ -n "$API_HASH" ]; then
            API_ARGS=(-D TDESKTOP_API_ID="$API_ID" -D TDESKTOP_API_HASH="$API_HASH")
          fi

          docker run --rm \
          -u "$(id -u)" \
          -v "$PWD:/usr/src/tdesktop" \
          -v "$CCACHE_DIR:/var/cache/ccache" \
          -e CONFIG=Release \
          -e CCACHE_MAXSIZE=1Gi \
          -e CCACHE_SLOPPINESS=pch_defines,time_macros \
          "$IMAGE_TAG" \
          env "${CACHE_ENV[@]}" /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
          -D CMAKE_CONFIGURATION_TYPES=Release \
          "${API_ARGS[@]}" \
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF \
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF
          python3 .github/scripts/ci_cache.py mark application --end

      - name: Read compiler cache statistics.
        id: cache-stats
        continue-on-error: true
        if: ${{ !cancelled() && inputs.compiler_cache && steps.cache-reset.outcome == 'success' }}
        shell: bash
        run: python3 .github/scripts/ci_cache.py stats ccache

      - name: Save application compiler cache.
        if: ${{ !cancelled() && steps.cache-stats.outcome == 'success' && steps.cache-stats.outputs.changed == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.cache-key.outputs.app-key }}

      - name: Check.
        run: |
          filePath="out/Release/AywGram"
          if test -f "$filePath"; then
            echo "Build successfully done! :)"

            size=$(stat -c %s "$filePath")
            echo "File size of ${filePath}: ${size} Bytes."
          else
            echo "Build error, output file does not exist."
            exit 1
          fi
          test -x out/Release/Updater

      - name: Package distribution.
        id: package
        if: inputs.warm_cache != true
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release_version.outputs.version_name }}"
          asset_name="AywGram-v${version}-linux-x86_64.tar.gz"
          asset_path="dist/${asset_name}"
          mkdir -p dist
          test -x out/Release/AywGram
          test -x out/Release/Updater
          tar -czf "$asset_path" -C out/Release AywGram Updater
          if [ "${{ inputs.update_metadata }}" = true ]; then
            python3 .github/scripts/update_release_metadata.py fragment \
              --target linux-x86_64 \
              --app-version "${{ steps.release_version.outputs.app_version }}" \
              --revision "${{ steps.release_version.outputs.revision }}" \
              --version-name "$version" \
              --release "${{ inputs.release_tag }}" \
              --asset "$asset_path" \
              --output dist/update-fragment-linux-x86_64.json
          fi
          echo "asset_name=$asset_name" >> "$GITHUB_OUTPUT"
          echo "asset_path=$asset_path" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        if: env.UPLOAD_ARTIFACT == 'true' && inputs.distribute != true
        name: Upload artifact.
        with:
          name: ${{ steps.package.outputs.asset_name }}
          path: ${{ steps.package.outputs.asset_path }}
          retention-days: 1

      - name: Publish prerelease asset and notify Telegram.
        if: ${{ inputs.distribute == true && inputs.warm_cache != true }}
        shell: bash
        env:
          ASSET_NAME: ${{ steps.package.outputs.asset_name }}
          ASSET_PATH: ${{ steps.package.outputs.asset_path }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_TAGS: '#aywgram #linux #ci'
          NOTIFY_TELEGRAM: ${{ inputs.notify }}
        run: bash .github/scripts/publish-prerelease.sh

      - uses: actions/upload-artifact@v7
        if: inputs.update_metadata == true && inputs.warm_cache != true
        name: Upload update metadata fragment.
        with:
          name: update-fragment-linux-x86_64
          path: dist/update-fragment-linux-x86_64.json
          retention-days: 1

      - name: Summarize caches.
        continue-on-error: true
        if: ${{ !cancelled() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CACHE_RESULTS: >-
            [{"layer": "Docker layers", "key": "${{ steps.cache-libs.outputs.cache-primary-key }}", "restored": "${{ steps.cache-libs.outputs.cache-matched-key }}", "hit": "${{ steps.cache-libs.outputs.cache-hit }}"}, {"layer": "Docker mounts", "key": "${{ steps.cache-mounts.outputs.cache-primary-key }}", "restored": "${{ steps.cache-mounts.outputs.cache-matched-key }}", "hit": "${{ steps.cache-mounts.outputs.cache-hit }}"}, {"layer": "Application", "key": "${{ steps.cache-app.outputs.cache-primary-key }}", "restored": "${{ steps.cache-app.outputs.cache-matched-key }}", "hit": "${{ steps.cache-app.outputs.cache-hit }}"}]
        run: python3 .github/scripts/ci_cache.py summary
