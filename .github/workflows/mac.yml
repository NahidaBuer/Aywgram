name: MacOS.

on:
  workflow_call:
    inputs:
      source_sha:
        description: Validated release commit supplied by the prerelease coordinator.
        required: false
        default: ''
        type: string
      warm_cache:
        description: Build caches only on the default branch; do not distribute artifacts.
        required: false
        default: false
        type: boolean
      compiler_cache:
        description: Enable application compiler caching.
        required: false
        default: true
        type: boolean
      arch:
        required: false
        default: arm64
        type: string
      distribute:
        required: false
        default: false
        type: boolean
      release_tag:
        required: false
        default: ''
        type: string
      notify:
        required: false
        default: true
        type: boolean
      update_metadata:
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      warm_cache:
        description: Build caches only on the default branch; do not distribute artifacts.
        required: false
        default: false
        type: boolean
      compiler_cache:
        description: Enable application compiler caching.
        required: false
        default: true
        type: boolean
      arch:
        description: mac architecture to build.
        required: true
        default: arm64
        type: choice
        options:
          - arm64
      distribute:
        description: Upload to an existing prerelease and notify Telegram.
        required: true
        default: false
        type: boolean
      release_tag:
        description: Existing prerelease tag; required when distribute is enabled.
        required: false
        type: string
      notify:
        description: Notify the Telegram channel after uploading.
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  actions: read

defaults:
  run:
    shell: bash

jobs:

  validate-distribution:
    name: Validate build inputs
    runs-on: ubuntu-latest

    steps:
      - name: Validate cache mode.
        shell: bash
        env:
          WARM_CACHE: ${{ inputs.warm_cache }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          DISTRIBUTE: ${{ inputs.distribute }}
          UPDATE_METADATA: ${{ inputs.update_metadata }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ "$WARM_CACHE" = true ]; then
            if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ] \
              || [ "$DISTRIBUTE" = true ] || [ "$UPDATE_METADATA" = true ] \
              || [ -n "$RELEASE_TAG" ] || [ -n "$SOURCE_SHA" ]; then
              echo '::error::Cache warming requires the default branch, no release_tag/source_sha and no distribution or metadata update.'
              exit 1
            fi
          fi

      - name: Validate architecture, prerelease and secrets.
        shell: bash
        env:
          ARCH: ${{ inputs.arch }}
          DISTRIBUTE: ${{ inputs.distribute }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          NOTIFY_TELEGRAM: ${{ inputs.notify }}
        run: |
          set -euo pipefail
          case "$ARCH" in
            arm64) ;;
            *) echo "::error::Unsupported mac architecture: $ARCH"; exit 1;;
          esac
          if [ "$DISTRIBUTE" != true ]; then
            exit 0
          fi
          if [ -z "$RELEASE_TAG" ]; then
            echo '::error::release_tag is required when distribute is enabled.'
            exit 1
          fi
          if [ "$NOTIFY_TELEGRAM" = true ] \
            && { [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHANNEL_ID" ]; }; then
            echo '::error::Configure TELEGRAM_BOT_TOKEN and TELEGRAM_CHANNEL_ID repository secrets.'
            exit 1
          fi
          release_state="$(
            gh release view "$RELEASE_TAG" \
              --repo "$GH_REPO" \
              --json isDraft,isPrerelease \
              --jq '.isDraft or .isPrerelease'
          )"
          if [ "$release_state" != true ]; then
            echo "::error::Release $RELEASE_TAG is neither draft nor prerelease."
            exit 1
          fi

  build:
    name: mac (${{ inputs.arch }})
    runs-on: macos-latest
    needs: validate-distribution
    concurrency:
      group: ${{ inputs.warm_cache && 'warm-cache-mac-arm64' || format('mac-{0}-{1}', github.run_id, github.run_attempt) }}
      cancel-in-progress: false
    env:
      REPO_NAME: ${{ github.event.repository.name }}
      UPLOAD_ARTIFACT: ${{ inputs.warm_cache && 'false' || 'true' }}
      CCACHE_MAXSIZE: '1Gi'
      CCACHE_COMPILERCHECK: content
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_SLOPPINESS: pch_defines,time_macros
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_UPGRADE: '1'
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      API_ID: ${{ secrets.API_ID }}
      API_HASH: ${{ secrets.API_HASH }}

    steps:
      - name: Clone.
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.warm_cache && github.sha || inputs.source_sha || inputs.release_tag || github.ref }}
          submodules: recursive
          path: ${{ env.REPO_NAME }}

      - name: Resolve release version.
        id: release_version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          cd "$REPO_NAME"
          python3 .github/scripts/release_version.py --tag "$RELEASE_TAG" --apply --github-output "$GITHUB_OUTPUT"

      - name: Set up build tools.
        run: |
          for tool in automake libtool meson nasm ninja pkg-config; do
            if ! brew list --versions "$tool" >/dev/null 2>&1; then
              brew install "$tool"
            fi
          done
          xcodebuild -version

      - name: Compute cache keys.
        id: cache-key
        run: python3 "$REPO_NAME/.github/scripts/ci_cache.py" keys mac arm64

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache/restore@v6
        with:
          path: |
            Libraries
            ThirdParty
          key: ${{ steps.cache-key.outputs.prefix }}-libs-${{ steps.cache-key.outputs.dependencies }}
          restore-keys: ${{ steps.cache-key.outputs.prefix }}-libs-

      - name: Libraries.
        run: |
          python3 "$REPO_NAME/.github/scripts/ci_cache.py" mark dependencies
          "./$REPO_NAME/Telegram/build/prepare/mac.sh" skip-debug silent
          python3 "$REPO_NAME/.github/scripts/ci_cache.py" mark dependencies --end

      - name: Prune dependency cache.
        run: find Libraries '(' '(' ! '(' -name '*.a' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -perm +111 ')' -type f ')' -o -empty ')' -delete

      - name: Save libraries cache.
        if: steps.cache-libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            Libraries
            ThirdParty
          key: ${{ steps.cache-libs.outputs.cache-primary-key }}

      - name: Install ccache and compiler wrappers.
        if: inputs.compiler_cache
        run: |
          python3 "$REPO_NAME/.github/scripts/ci_cache.py" install mac-arm64
          python3 "$REPO_NAME/.github/scripts/ci_cache.py" mac-wrappers

      - name: Restore application compiler cache.
        id: cache-app
        if: inputs.compiler_cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.cache-key.outputs.app-key }}
          restore-keys: ${{ steps.cache-key.outputs.app-prefix }}

      - name: Start application timer.
        shell: bash
        run: python3 "$REPO_NAME/.github/scripts/ci_cache.py" mark application

      - name: Reset compiler cache statistics.
        id: cache-reset
        if: inputs.compiler_cache
        shell: bash
        run: ccache --zero-stats

      - name: Configure.
        env:
          COMPILER_CACHE: ${{ inputs.compiler_cache }}
        run: |
          cd "$REPO_NAME/Telegram"
          API_ARGS=(-D TDESKTOP_API_TEST=ON)
          if [ -n "$API_ID" ] && [ -n "$API_HASH" ]; then
            API_ARGS=(-D TDESKTOP_API_ID="$API_ID" -D TDESKTOP_API_HASH="$API_HASH")
          fi

          CACHE_ARGS=()
          if [ "$COMPILER_CACHE" = true ]; then
            CACHE_ARGS=(
              "-DCMAKE_XCODE_ATTRIBUTE_CC=$CACHE_C_WRAPPER"
              "-DCMAKE_XCODE_ATTRIBUTE_CXX=$CACHE_CXX_WRAPPER"
              "-DCMAKE_XCODE_ATTRIBUTE_LD=$REAL_C_COMPILER"
              "-DCMAKE_XCODE_ATTRIBUTE_LDPLUSPLUS=$REAL_CXX_COMPILER"
              "-DCMAKE_CXX_FLAGS=-Xclang -fno-pch-timestamp"
              "-DCMAKE_OBJCXX_FLAGS=-Xclang -fno-pch-timestamp"
            )
          fi
          ./configure.sh \
          "${CACHE_ARGS[@]}" \
          -D CMAKE_CONFIGURATION_TYPES=Release \
          -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
          "${API_ARGS[@]}" \
          -D DESKTOP_APP_MAC_ARCH=${{ inputs.arch }} \
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF \
          -D CMAKE_EXE_LINKER_FLAGS="-Wl,-x"

      - name: Telegram Desktop build.
        run: |
          cd "$REPO_NAME/Telegram"
          XCODE_SETTINGS=(
            IPHONEOS_DEPLOYMENT_TARGET=
            IOS_SIMULATOR_DEPLOYMENT_TARGET=
            TVOS_DEPLOYMENT_TARGET=
            WATCHOS_DEPLOYMENT_TARGET=
            XROS_DEPLOYMENT_TARGET=
            DRIVERKIT_DEPLOYMENT_TARGET=
          )
          xcodebuild -project ../out/Telegram.xcodeproj \
            -target external_qt_static_plugins_kimageformats_autogen \
            -configuration Release -showBuildSettings -json \
            "${XCODE_SETTINGS[@]}" > ../out/ci-xcode-build-settings.json
          python3 - "${XCODE_SETTINGS[@]}" <<'PY'
          import json
          import pathlib
          import sys

          targets = json.loads(pathlib.Path('../out/ci-xcode-build-settings.json').read_text())
          if not targets:
              sys.exit('Xcode returned no AutoMoc build settings.')
          for target in targets:
              settings = target['buildSettings']
              print(f"{target['target']}: SDKROOT={settings.get('SDKROOT')}, "
                    f"MACOSX_DEPLOYMENT_TARGET={settings.get('MACOSX_DEPLOYMENT_TARGET')}")
              for argument in sys.argv[1:]:
                  name = argument.split('=', 1)[0]
                  if settings.get(name):
                      sys.exit(f"Unexpected Xcode build setting: {name}={settings[name]}")
          PY
          cmake --build ../out --config Release --parallel -- "${XCODE_SETTINGS[@]}"
          python3 ../.github/scripts/ci_cache.py mark application --end

      - name: Read compiler cache statistics.
        id: cache-stats
        continue-on-error: true
        if: ${{ !cancelled() && inputs.compiler_cache && steps.cache-reset.outcome == 'success' }}
        shell: bash
        run: python3 "$REPO_NAME/.github/scripts/ci_cache.py" stats ccache

      - name: Save application compiler cache.
        if: ${{ !cancelled() && steps.cache-stats.outcome == 'success' && steps.cache-stats.outputs.changed == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.cache-key.outputs.app-key }}

      - name: Package distribution.
        id: package
        if: env.UPLOAD_ARTIFACT == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$REPO_NAME"
          VERSION="${{ steps.release_version.outputs.version_name }}"
          ASSET_NAME="AywGram-v${VERSION}-mac-${{ inputs.arch }}.zip"
          ASSET_PATH="$GITHUB_WORKSPACE/dist/$ASSET_NAME"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          ditto -c -k --sequesterRsrc --keepParent out/Release/AywGram.app "$ASSET_PATH"
          test -x out/Release/AywGram.app/Contents/MacOS/AywGram
          test -x out/Release/AywGram.app/Contents/Frameworks/Updater
          if [ "${{ inputs.update_metadata }}" = true ]; then
            python3 .github/scripts/update_release_metadata.py fragment \
              --target mac-${{ inputs.arch }} \
              --app-version "${{ steps.release_version.outputs.app_version }}" \
              --revision "${{ steps.release_version.outputs.revision }}" \
              --version-name "$VERSION" \
              --release "${{ inputs.release_tag }}" \
              --asset "$ASSET_PATH" \
              --output "$GITHUB_WORKSPACE/dist/update-fragment-mac-${{ inputs.arch }}.json"
          fi
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        if: env.UPLOAD_ARTIFACT == 'true' && inputs.distribute != true
        name: Upload artifact.
        with:
          name: ${{ steps.package.outputs.asset_name }}
          path: ${{ steps.package.outputs.asset_path }}
          retention-days: 1

      - name: Publish prerelease asset and notify Telegram.
        if: ${{ inputs.distribute == true && inputs.warm_cache != true }}
        shell: bash
        env:
          ASSET_NAME: ${{ steps.package.outputs.asset_name }}
          ASSET_PATH: ${{ steps.package.outputs.asset_path }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_TAGS: '#aywgram #mac #ci'
          NOTIFY_TELEGRAM: ${{ inputs.notify }}
        run: bash "$REPO_NAME/.github/scripts/publish-prerelease.sh"

      - uses: actions/upload-artifact@v7
        if: inputs.update_metadata == true && inputs.warm_cache != true
        name: Upload update metadata fragment.
        with:
          name: update-fragment-mac-${{ inputs.arch }}
          path: dist/update-fragment-mac-${{ inputs.arch }}.json
          retention-days: 1

      - name: Summarize caches.
        continue-on-error: true
        if: ${{ !cancelled() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CACHE_RESULTS: >-
            [{"layer": "Libraries", "key": "${{ steps.cache-libs.outputs.cache-primary-key }}", "restored": "${{ steps.cache-libs.outputs.cache-matched-key }}", "hit": "${{ steps.cache-libs.outputs.cache-hit }}"}, {"layer": "Application", "key": "${{ steps.cache-app.outputs.cache-primary-key }}", "restored": "${{ steps.cache-app.outputs.cache-matched-key }}", "hit": "${{ steps.cache-app.outputs.cache-hit }}"}]
        run: python3 "$REPO_NAME/.github/scripts/ci_cache.py" summary
