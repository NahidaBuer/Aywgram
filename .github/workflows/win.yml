name: Windows.

on:
  workflow_call:
    inputs:
      source_sha:
        description: Validated release commit supplied by the prerelease coordinator.
        required: false
        default: ''
        type: string
      warm_cache:
        description: Build caches only on the default branch; do not distribute artifacts.
        required: false
        default: false
        type: boolean
      compiler_cache:
        description: Enable application compiler caching.
        required: false
        default: true
        type: boolean
      arch:
        required: false
        default: arm64
        type: string
      distribute:
        required: false
        default: false
        type: boolean
      release_tag:
        required: false
        default: ''
        type: string
      notify:
        required: false
        default: true
        type: boolean
      update_metadata:
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      warm_cache:
        description: Build caches only on the default branch; do not distribute artifacts.
        required: false
        default: false
        type: boolean
      compiler_cache:
        description: Enable application compiler caching.
        required: false
        default: true
        type: boolean
      arch:
        description: Windows architecture to build.
        required: true
        default: arm64
        type: choice
        options:
          - arm64
          - x64
      distribute:
        description: Upload to an existing prerelease and notify Telegram.
        required: true
        default: false
        type: boolean
      release_tag:
        description: Existing prerelease tag; required when distribute is enabled.
        required: false
        type: string
      notify:
        description: Notify the Telegram channel after uploading.
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  actions: read

jobs:

  validate-distribution:
    name: Validate distribution target
    runs-on: ubuntu-latest

    steps:
      - name: Validate cache mode.
        shell: bash
        env:
          WARM_CACHE: ${{ inputs.warm_cache }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          DISTRIBUTE: ${{ inputs.distribute }}
          UPDATE_METADATA: ${{ inputs.update_metadata }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TARGET_ARCH: ${{ inputs.arch }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          case "$TARGET_ARCH" in
            arm64|x64) ;;
            *) echo "::error::Unsupported Windows architecture: $TARGET_ARCH"; exit 1;;
          esac
          if [ "$WARM_CACHE" = true ]; then
            if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ] \
              || [ "$DISTRIBUTE" = true ] || [ "$UPDATE_METADATA" = true ] \
              || [ -n "$RELEASE_TAG" ] || [ -n "$SOURCE_SHA" ]; then
              echo '::error::Cache warming requires the default branch, no release_tag/source_sha and no distribution or metadata update.'
              exit 1
            fi
          fi

      - name: Validate prerelease and secrets.
        if: ${{ inputs.distribute == true && inputs.warm_cache != true }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          NOTIFY_TELEGRAM: ${{ inputs.notify }}
        run: |
          set -euo pipefail
          case "${{ inputs.arch }}" in
            arm64|x64) ;;
            *) echo "::error::Unsupported Windows architecture: ${{ inputs.arch }}"; exit 1;;
          esac
          if [ -z "$RELEASE_TAG" ]; then
            echo '::error::release_tag is required when distribute is enabled.'
            exit 1
          fi
          if [ "$NOTIFY_TELEGRAM" = true ] \
            && { [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHANNEL_ID" ]; }; then
            echo '::error::Configure TELEGRAM_BOT_TOKEN and TELEGRAM_CHANNEL_ID repository secrets.'
            exit 1
          fi
          release_state="$(
            gh release view "$RELEASE_TAG" \
              --repo "$GH_REPO" \
              --json isDraft,isPrerelease \
              --jq '.isDraft or .isPrerelease'
          )"
          if [ "$release_state" != true ]; then
            echo "::error::Release $RELEASE_TAG is neither draft nor prerelease."
            exit 1
          fi

  windows:
    name: Windows ${{ inputs.arch }} (Qt 6)
    runs-on: ${{ inputs.arch == 'arm64' && 'windows-11-arm' || 'windows-latest' }}
    needs: validate-distribution
    concurrency:
      group: ${{ inputs.warm_cache && format('warm-cache-windows-{0}', inputs.arch) || format('windows-{0}-{1}-{2}', inputs.arch, github.run_id, github.run_attempt) }}
      cancel-in-progress: false

    strategy:
      fail-fast: false
      matrix:
        arch: ["${{ inputs.arch }}"]
        qt: [qt6]

    env:
      UPLOAD_ARTIFACT: ${{ inputs.warm_cache && 'false' || 'true' }}
      SCCACHE_CACHE_SIZE: '1G'
      SCCACHE_IDLE_TIMEOUT: '0'
      SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
      API_ID: ${{ secrets.API_ID }}
      API_HASH: ${{ secrets.API_HASH }}

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories.
        run: |
          set "TBUILD_TARGET=%userprofile%\TBuild"
          if not exist "%TBUILD_TARGET%\Libraries" mkdir "%TBUILD_TARGET%\Libraries"
          if not exist "%TBUILD_TARGET%\tmp" mkdir "%TBUILD_TARGET%\tmp"
          mklink /d "%GITHUB_WORKSPACE%\TBuild" "%TBUILD_TARGET%"
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          if "${{ inputs.arch }}"=="x64" (
            echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%
          ) else (
            echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries>>%GITHUB_ENV%
          )
          echo TEMP=%TBUILD_TARGET%\tmp>>%GITHUB_ENV%
          echo TMP=%TBUILD_TARGET%\tmp>>%GITHUB_ENV%
          echo TMPDIR=%TBUILD_TARGET%\tmp>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> "$GITHUB_ENV"

      - name: Clone.
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.warm_cache && github.sha || inputs.source_sha || inputs.release_tag || github.ref }}
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: Resolve release version.
        id: release_version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          cd "$TBUILD/$REPO_NAME"
          python .github/scripts/release_version.py --tag "$RELEASE_TAG" --apply --github-output "$GITHUB_OUTPUT"

      - name: First set up.
        shell: bash
        run: |
          DOCPATH="$TBUILD/$REPO_NAME/docs/building-win-x64.md"
          SDK="$(grep -A 1 'Windows SDK' "$DOCPATH" | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)"
          if [ -z "$SDK" ]; then
            echo "Could not determine the Windows SDK version from $DOCPATH" >&2
            exit 1
          fi
          echo "SDK=$SDK" >> "$GITHUB_ENV"

          echo "Configurate git for cherry-picks."
          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      - name: Install VS 2026 Build Tools.
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installed = & $vswhere -products '*' -version '[18.0,19.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 Microsoft.VisualStudio.Component.VC.ATL.ARM64 -property installationPath
          if ($LASTEXITCODE -ne 0) { throw 'Failed to inspect Visual Studio installations.' }
          if ($installed) { Write-Host "Using existing VS 2026 ARM64 tools: $installed"; exit 0 }
          $exe = Join-Path $env:RUNNER_TEMP 'vs_buildtools.exe'
          Invoke-WebRequest -Uri https://aka.ms/vs/18/stable/vs_buildtools.exe -OutFile $exe
          $p = Start-Process -FilePath $exe -WindowStyle Hidden -Wait -PassThru -ArgumentList `
            '--quiet','--wait','--norestart','--nocache', `
            '--add','Microsoft.VisualStudio.Workload.VCTools', `
            '--add','Microsoft.VisualStudio.Component.VC.Tools.ARM64', `
            '--add','Microsoft.VisualStudio.Component.VC.ATL.ARM64'
          Remove-Item $exe -Force -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { exit $p.ExitCode }

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: ${{ matrix.arch }}
          sdk: ${{ env.SDK }}
          toolset: ${{ case(matrix.arch == 'arm64', '', '14.44') }}

      - name: Compute cache keys.
        id: cache-key
        run: python "%TBUILD%\%REPO_NAME%\.github\scripts\ci_cache.py" keys windows ${{ inputs.arch }}

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        id: cache-third-party
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ steps.cache-key.outputs.prefix }}-third-party-${{ steps.cache-key.outputs.dependencies }}
          restore-keys: ${{ steps.cache-key.outputs.prefix }}-third-party-

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ steps.cache-key.outputs.prefix }}-libs-${{ steps.cache-key.outputs.dependencies }}
          restore-keys: ${{ steps.cache-key.outputs.prefix }}-libs-

      - name: Qt cache.
        id: cache-qt
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ steps.cache-key.outputs.prefix }}-qt-${{ steps.cache-key.outputs.dependencies }}
          restore-keys: ${{ steps.cache-key.outputs.prefix }}-qt-

      - name: Libraries.
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
          NUMBER_OF_PROCESSORS: "2"
        run: |
          python "%TBUILD%\%REPO_NAME%\.github\scripts\ci_cache.py" mark dependencies
          call "%TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat" skip-debug skip-dump-syms silent ${{ matrix.qt }}
          if errorlevel 1 exit /b 1
          python "%TBUILD%\%REPO_NAME%\.github\scripts\ci_cache.py" mark dependencies --end

      - name: Prune dependency caches.
        shell: pwsh
        run: |
          bash -lc 'find "$LibrariesPath" \( \( ! \( -name "*.lib" -o -name "*.a" -o -name "*.exe" -o -name "*.h" -o -name "*.hpp" -o -name "*.inc" -o -name "*.cmake" -o -name "*.pc" -o -path "*/include/*" -o -path "*/gas-preprocessor/*" -o -path "*/local/lib/pkgconfig/*" -o -path "*/nv-codec-headers/*" -o -path "*/objects-*" -o -path "*/cache_keys/*" -o -path "*/patches/*" \) -type f \) -o -empty \) -delete'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $cacheDirectories = @(
            "$env:TBUILD\ThirdParty\msys64\var\cache\pacman\pkg",
            "$env:TBUILD\ThirdParty\msys64\tmp",
            "$env:USERPROFILE\.nuget\packages",
            "$env:LOCALAPPDATA\NuGet\http-cache",
            "$env:LOCALAPPDATA\NuGet\plugins-cache",
            "$env:LOCALAPPDATA\NuGet\v3-cache",
            "$env:LOCALAPPDATA\pip\Cache",
            "$env:LOCALAPPDATA\npm-cache",
            "$env:ProgramData\chocolatey\cache"
          )
          foreach ($path in $cacheDirectories) {
            if (Test-Path -LiteralPath $path) {
              Get-ChildItem -LiteralPath $path -Force -ErrorAction SilentlyContinue |
                Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          Get-PSDrive -PSProvider FileSystem |
            Select-Object Name,
              @{ Name = 'FreeGiB'; Expression = { [math]::Round($_.Free / 1GB, 2) } },
              @{ Name = 'UsedGiB'; Expression = { [math]::Round($_.Used / 1GB, 2) } } |
            Format-Table -AutoSize

      - name: Save ThirdParty cache.
        if: steps.cache-third-party.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ steps.cache-key.outputs.prefix }}-third-party-${{ steps.cache-key.outputs.dependencies }}

      - name: Save libraries cache.
        if: steps.cache-libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ steps.cache-key.outputs.prefix }}-libs-${{ steps.cache-key.outputs.dependencies }}

      - name: Save Qt cache.
        if: steps.cache-qt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ steps.cache-key.outputs.prefix }}-qt-${{ steps.cache-key.outputs.dependencies }}

      - name: Read configuration matrix.
        id: matrix
        shell: bash
        run: |
          cd "$TBUILD/$REPO_NAME"
          if [ "${{ matrix.arch }}" = arm64 ]; then
            echo "target=windows-arm64" >> "$GITHUB_OUTPUT"
          else
            echo "target=windows-x86_64" >> "$GITHUB_OUTPUT"
          fi

      - name: Install sccache.
        if: inputs.compiler_cache
        run: python "%TBUILD%\%REPO_NAME%\.github\scripts\ci_cache.py" install windows-${{ inputs.arch }}

      - name: Restore application compiler cache.
        id: cache-app
        if: inputs.compiler_cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: ${{ steps.cache-key.outputs.app-key }}
          restore-keys: ${{ steps.cache-key.outputs.app-prefix }}

      - name: Start application timer.
        shell: bash
        run: python "$TBUILD/$REPO_NAME/.github/scripts/ci_cache.py" mark application

      - name: Reset compiler cache statistics.
        id: cache-reset
        if: inputs.compiler_cache
        shell: bash
        run: sccache --zero-stats

      - name: Telegram Desktop build.
        shell: pwsh
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
          NUMBER_OF_PROCESSORS: "2"
          COMPILER_CACHE: ${{ inputs.compiler_cache }}
        run: |
          Set-Location "$env:TBUILD\$env:REPO_NAME\Telegram"
          $configureArgs = @(
            '-G', 'Ninja Multi-Config', 'qt6',
            '-D', 'CMAKE_CONFIGURATION_TYPES=Release',
            '-D', 'CMAKE_MSVC_DEBUG_INFORMATION_FORMAT=',
            '-D', 'DESKTOP_APP_DISABLE_AUTOUPDATE=OFF',
            '-D', 'DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF'
          )
          if ($env:API_ID -and $env:API_HASH) {
            $configureArgs += @('-D', "TDESKTOP_API_ID=$env:API_ID", '-D', "TDESKTOP_API_HASH=$env:API_HASH")
          } else {
            $configureArgs += @('-D', 'TDESKTOP_API_TEST=ON')
          }
          if ($env:COMPILER_CACHE -eq 'true') {
            $configureArgs += @('-D', 'CMAKE_C_COMPILER_LAUNCHER=sccache', '-D', 'CMAKE_CXX_COMPILER_LAUNCHER=sccache')
          }
          python configure.py @configureArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build ..\out --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ..\.github\scripts\ci_cache.py mark application --end

      - name: Read compiler cache statistics.
        id: cache-stats
        continue-on-error: true
        if: ${{ !cancelled() && inputs.compiler_cache && steps.cache-reset.outcome == 'success' }}
        shell: bash
        run: python "$TBUILD/$REPO_NAME/.github/scripts/ci_cache.py" stats sccache

      - name: Save application compiler cache.
        if: ${{ !cancelled() && steps.cache-stats.outcome == 'success' && steps.cache-stats.outputs.changed == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: ${{ steps.cache-key.outputs.app-key }}

      - name: Package distribution.
        id: package
        if: env.UPLOAD_ARTIFACT == 'true'
        shell: pwsh
        run: |
          $target = "${{ steps.matrix.outputs.target }}"
          $assetName = "AywGram-v${{ steps.release_version.outputs.version_name }}-$target.zip"
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $assetPath = Join-Path $dist $assetName
          $binary = Join-Path $env:TBUILD "$env:REPO_NAME\out\Release\AywGram.exe"
          $updater = Join-Path $env:TBUILD "$env:REPO_NAME\out\Release\Updater.exe"
          $modules = Join-Path $env:TBUILD "$env:REPO_NAME\out\Release\modules"
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) { throw "Missing AywGram.exe" }
          if (-not (Test-Path -LiteralPath $updater -PathType Leaf)) { throw "Missing Updater.exe" }
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          $items = @($binary, $updater)
          if (Test-Path -LiteralPath $modules -PathType Container) { $items += $modules }
          Compress-Archive -LiteralPath $items -DestinationPath $assetPath -CompressionLevel Optimal
          "asset_name=$assetName" >> $env:GITHUB_OUTPUT
          "asset_path=dist/$assetName" >> $env:GITHUB_OUTPUT

      - name: Create update metadata fragment.
        if: inputs.update_metadata == true && inputs.warm_cache != true
        shell: bash
        run: |
          python "$TBUILD/$REPO_NAME/.github/scripts/update_release_metadata.py" fragment \
            --target "${{ steps.matrix.outputs.target }}" \
            --app-version "${{ steps.release_version.outputs.app_version }}" \
            --revision "${{ steps.release_version.outputs.revision }}" \
            --version-name "${{ steps.release_version.outputs.version_name }}" \
            --release "${{ inputs.release_tag }}" \
            --asset "${{ steps.package.outputs.asset_path }}" \
            --output "dist/update-fragment-${{ steps.matrix.outputs.target }}.json"

      - uses: actions/upload-artifact@v7
        name: Upload artifact.
        if: env.UPLOAD_ARTIFACT == 'true' && inputs.distribute != true
        with:
          name: ${{ steps.package.outputs.asset_name }}
          path: ${{ steps.package.outputs.asset_path }}
          retention-days: 1

      - name: Publish prerelease asset and notify Telegram.
        if: ${{ inputs.distribute == true && inputs.warm_cache != true }}
        shell: bash
        env:
          ASSET_NAME: ${{ steps.package.outputs.asset_name }}
          ASSET_PATH: ${{ steps.package.outputs.asset_path }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_TAGS: '#aywgram #woa #ci'
          NOTIFY_TELEGRAM: ${{ inputs.notify }}
        run: bash "$TBUILD/$REPO_NAME/.github/scripts/publish-prerelease.sh"

      - uses: actions/upload-artifact@v7
        if: inputs.update_metadata == true && inputs.warm_cache != true
        name: Upload update metadata fragment.
        with:
          name: update-fragment-${{ steps.matrix.outputs.target }}
          path: dist/update-fragment-${{ steps.matrix.outputs.target }}.json
          retention-days: 1

      - name: Summarize caches.
        continue-on-error: true
        if: ${{ !cancelled() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CACHE_RESULTS: >-
            [{"layer": "ThirdParty", "key": "${{ steps.cache-third-party.outputs.cache-primary-key }}", "restored": "${{ steps.cache-third-party.outputs.cache-matched-key }}", "hit": "${{ steps.cache-third-party.outputs.cache-hit }}"}, {"layer": "Libraries", "key": "${{ steps.cache-libs.outputs.cache-primary-key }}", "restored": "${{ steps.cache-libs.outputs.cache-matched-key }}", "hit": "${{ steps.cache-libs.outputs.cache-hit }}"}, {"layer": "Qt", "key": "${{ steps.cache-qt.outputs.cache-primary-key }}", "restored": "${{ steps.cache-qt.outputs.cache-matched-key }}", "hit": "${{ steps.cache-qt.outputs.cache-hit }}"}, {"layer": "Application", "key": "${{ steps.cache-app.outputs.cache-primary-key }}", "restored": "${{ steps.cache-app.outputs.cache-matched-key }}", "hit": "${{ steps.cache-app.outputs.cache-hit }}"}]
        run: python "$TBUILD/$REPO_NAME/.github/scripts/ci_cache.py" summary
