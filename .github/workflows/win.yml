name: Windows.

on:
  workflow_call:
    inputs:
      arch:
        required: false
        default: arm64
        type: string
      distribute:
        required: false
        default: false
        type: boolean
      release_tag:
        required: false
        default: ''
        type: string
      notify:
        required: false
        default: true
        type: boolean
      update_metadata:
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      arch:
        description: Windows architecture to build.
        required: true
        default: arm64
        type: choice
        options:
          - arm64
          - x64
      distribute:
        description: Upload to an existing prerelease and notify Telegram.
        required: true
        default: false
        type: boolean
      release_tag:
        description: Existing prerelease tag; required when distribute is enabled.
        required: false
        type: string
      notify:
        description: Notify the Telegram channel after uploading.
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:

  validate-distribution:
    name: Validate distribution target
    runs-on: ubuntu-latest

    steps:
      - name: Validate prerelease and secrets.
        if: ${{ inputs.distribute == true }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          NOTIFY_TELEGRAM: ${{ inputs.notify }}
        run: |
          set -euo pipefail
          case "${{ inputs.arch }}" in
            arm64|x64) ;;
            *) echo "::error::Unsupported Windows architecture: ${{ inputs.arch }}"; exit 1;;
          esac
          if [ -z "$RELEASE_TAG" ]; then
            echo '::error::release_tag is required when distribute is enabled.'
            exit 1
          fi
          if [ "$NOTIFY_TELEGRAM" = true ] \
            && { [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHANNEL_ID" ]; }; then
            echo '::error::Configure TELEGRAM_BOT_TOKEN and TELEGRAM_CHANNEL_ID repository secrets.'
            exit 1
          fi
          release_state="$(
            gh release view "$RELEASE_TAG" \
              --repo "$GH_REPO" \
              --json isDraft,isPrerelease \
              --jq '.isDraft or .isPrerelease'
          )"
          if [ "$release_state" != true ]; then
            echo "::error::Release $RELEASE_TAG is neither draft nor prerelease."
            exit 1
          fi

  windows:
    name: Windows ${{ inputs.arch }} (Qt 6)
    runs-on: ${{ inputs.arch == 'arm64' && 'windows-11-arm' || 'windows-latest' }}
    needs: validate-distribution

    strategy:
      fail-fast: false
      matrix:
        arch: ["${{ inputs.arch }}"]
        qt: [qt6]
        generator: [""]

    env:
      UPLOAD_ARTIFACT: "true"
      ONLY_CACHE: "false"
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"
      API_ID: ${{ secrets.API_ID }}
      API_HASH: ${{ secrets.API_HASH }}

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories.
        run: |
          set "TBUILD_TARGET=%userprofile%\TBuild"
          if not exist "%TBUILD_TARGET%\Libraries" mkdir "%TBUILD_TARGET%\Libraries"
          if not exist "%TBUILD_TARGET%\tmp" mkdir "%TBUILD_TARGET%\tmp"
          mklink /d "%GITHUB_WORKSPACE%\TBuild" "%TBUILD_TARGET%"
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries>>%GITHUB_ENV%
          echo TEMP=%TBUILD_TARGET%\tmp>>%GITHUB_ENV%
          echo TMP=%TBUILD_TARGET%\tmp>>%GITHUB_ENV%
          echo TMPDIR=%TBUILD_TARGET%\tmp>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: Resolve release version.
        id: release_version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          cd "$TBUILD/$REPO_NAME"
          python .github/scripts/release_version.py --tag "$RELEASE_TAG" --apply --github-output "$GITHUB_OUTPUT"

      - name: First set up.
        shell: bash
        run: |
          DOCPATH="$TBUILD/$REPO_NAME/docs/building-win-x64.md"
          SDK="$(grep -A 1 'Windows SDK' "$DOCPATH" | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)"
          if [ -z "$SDK" ]; then
            echo "Could not determine the Windows SDK version from $DOCPATH" >&2
            exit 1
          fi
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          echo "Configurate git for cherry-picks."
          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      - name: Install VS 2026 Build Tools.
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'vs_buildtools.exe'
          Invoke-WebRequest -Uri https://aka.ms/vs/18/stable/vs_buildtools.exe -OutFile $exe
          $p = Start-Process -FilePath $exe -Wait -PassThru -ArgumentList `
            '--quiet','--wait','--norestart','--nocache', `
            '--add','Microsoft.VisualStudio.Workload.VCTools', `
            '--add','Microsoft.VisualStudio.Component.VC.Tools.ARM64', `
            '--add','Microsoft.VisualStudio.Component.VC.ATL.ARM64'
          Remove-Item $exe -Force -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { exit $p.ExitCode }

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: ${{ matrix.arch }}
          sdk: ${{ env.SDK }}
          toolset: ${{ case(matrix.arch == 'arm64', '', '14.44') }}

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        id: cache-third-party
        uses: actions/cache@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ matrix.arch }}-libs-v2-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ matrix.arch }}-libs-v2-

      - name: Qt cache.
        id: cache-qt
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ matrix.arch }}-${{ matrix.qt || 'qt' }}-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ matrix.arch }}-${{ matrix.qt || 'qt' }}-

      - name: Libraries.
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
          NUMBER_OF_PROCESSORS: "2"
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat skip-debug skip-dump-syms silent ${{ matrix.qt }}

      - name: Prune dependency caches.
        shell: pwsh
        run: |
          bash -lc 'find "$LibrariesPath" \( \( ! \( -name "*.lib" -o -name "*.a" -o -name "*.exe" -o -name "*.h" -o -name "*.hpp" -o -name "*.inc" -o -name "*.cmake" -o -name "*.pc" -o -path "*/include/*" -o -path "*/gas-preprocessor/*" -o -path "*/local/lib/pkgconfig/*" -o -path "*/nv-codec-headers/*" -o -path "*/objects-*" -o -path "*/cache_keys/*" -o -path "*/patches/*" \) -type f \) -o -empty \) -delete'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $cacheDirectories = @(
            "$env:TBUILD\ThirdParty\msys64\var\cache\pacman\pkg",
            "$env:TBUILD\ThirdParty\msys64\tmp",
            "$env:USERPROFILE\.nuget\packages",
            "$env:LOCALAPPDATA\NuGet\http-cache",
            "$env:LOCALAPPDATA\NuGet\plugins-cache",
            "$env:LOCALAPPDATA\NuGet\v3-cache",
            "$env:LOCALAPPDATA\pip\Cache",
            "$env:LOCALAPPDATA\npm-cache",
            "$env:ProgramData\chocolatey\cache"
          )
          foreach ($path in $cacheDirectories) {
            if (Test-Path -LiteralPath $path) {
              Get-ChildItem -LiteralPath $path -Force -ErrorAction SilentlyContinue |
                Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          Get-PSDrive -PSProvider FileSystem |
            Select-Object Name,
              @{ Name = 'FreeGiB'; Expression = { [math]::Round($_.Free / 1GB, 2) } },
              @{ Name = 'UsedGiB'; Expression = { [math]::Round($_.Used / 1GB, 2) } } |
            Format-Table -AutoSize

      - name: Save ThirdParty cache.
        if: steps.cache-third-party.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}

      - name: Save libraries cache.
        if: steps.cache-libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ matrix.arch }}-libs-v2-${{ env.CACHE_KEY }}

      - name: Save Qt cache.
        if: steps.cache-qt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ matrix.arch }}-${{ matrix.qt || 'qt' }}-${{ env.CACHE_KEY }}

      - name: Read configuration matrix.
        id: matrix
        shell: bash
        run: |
          cd "$TBUILD/$REPO_NAME"
          ARCH=""
          if [ -n "${{ matrix.arch }}" ]; then
            case "${{ matrix.arch }}" in
              x64_x86) ARCH="x86";;
              x64) ARCH="";;
              arm64) ARCH="arm";;
              *) ARCH="${{ matrix.arch }}";;
            esac
            echo "Architecture from matrix: $ARCH"
          fi

          GENERATOR=""
          if [ -n "${{ matrix.generator }}" ]; then
            GENERATOR="-G \"${{ matrix.generator }}\""
            echo "Generator from matrix: $GENERATOR"
          fi
          echo "TDESKTOP_BUILD_GENERATOR=$GENERATOR" >> $GITHUB_ENV

          [ -n "$GENERATOR" ] && ARCH=""
          echo "TDESKTOP_BUILD_ARCH=$ARCH" >> $GITHUB_ENV

          API="-D TDESKTOP_API_TEST=ON"
          if [ -n "$API_ID" ] && [ -n "$API_HASH" ]; then
            API="-D TDESKTOP_API_ID=\"$API_ID\" -D TDESKTOP_API_HASH=\"$API_HASH\""
          fi
          if [ "${{ matrix.arch }}" = arm64 ]; then
            echo "target=windows-arm64" >> $GITHUB_OUTPUT
          else
            echo "target=windows-x86_64" >> $GITHUB_OUTPUT
          fi
          echo "TDESKTOP_BUILD_API=$API" >> $GITHUB_ENV

      - name: Telegram Desktop build.
        if: env.ONLY_CACHE == 'false'
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
          NUMBER_OF_PROCESSORS: "2"
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat ^
          %TDESKTOP_BUILD_GENERATOR% ^
          %TDESKTOP_BUILD_ARCH% ^
          ${{ matrix.qt }} ^
          %TDESKTOP_BUILD_API% ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF

          cmake --build ..\out --config Release --parallel %CMAKE_BUILD_PARALLEL_LEVEL%

      - name: Package distribution.
        id: package
        if: env.UPLOAD_ARTIFACT == 'true'
        shell: pwsh
        run: |
          $target = "${{ steps.matrix.outputs.target }}"
          $assetName = "AywGram-v${{ steps.release_version.outputs.version_name }}-$target.zip"
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $assetPath = Join-Path $dist $assetName
          $binary = Join-Path $env:TBUILD "$env:REPO_NAME\out\Release\AywGram.exe"
          $updater = Join-Path $env:TBUILD "$env:REPO_NAME\out\Release\Updater.exe"
          $modules = Join-Path $env:TBUILD "$env:REPO_NAME\out\Release\modules"
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) { throw "Missing AywGram.exe" }
          if (-not (Test-Path -LiteralPath $updater -PathType Leaf)) { throw "Missing Updater.exe" }
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          $items = @($binary, $updater)
          if (Test-Path -LiteralPath $modules -PathType Container) { $items += $modules }
          Compress-Archive -LiteralPath $items -DestinationPath $assetPath -CompressionLevel Optimal
          "asset_name=$assetName" >> $env:GITHUB_OUTPUT
          "asset_path=dist/$assetName" >> $env:GITHUB_OUTPUT

      - name: Create update metadata fragment.
        if: inputs.update_metadata == true
        shell: bash
        run: |
          python "$TBUILD/$REPO_NAME/.github/scripts/update_release_metadata.py" fragment \
            --target "${{ steps.matrix.outputs.target }}" \
            --app-version "${{ steps.release_version.outputs.app_version }}" \
            --revision "${{ steps.release_version.outputs.revision }}" \
            --version-name "${{ steps.release_version.outputs.version_name }}" \
            --release "${{ inputs.release_tag }}" \
            --asset "${{ steps.package.outputs.asset_path }}" \
            --output "dist/update-fragment-${{ steps.matrix.outputs.target }}.json"

      - uses: actions/upload-artifact@v7
        name: Upload artifact.
        if: env.UPLOAD_ARTIFACT == 'true' && inputs.distribute != true
        with:
          name: ${{ steps.package.outputs.asset_name }}
          path: ${{ steps.package.outputs.asset_path }}
          retention-days: 1

      - name: Publish prerelease asset and notify Telegram.
        if: ${{ inputs.distribute == true }}
        shell: bash
        env:
          ASSET_NAME: ${{ steps.package.outputs.asset_name }}
          ASSET_PATH: ${{ steps.package.outputs.asset_path }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_TAGS: '#aywgram #woa #ci'
          NOTIFY_TELEGRAM: ${{ inputs.notify }}
        run: bash "$TBUILD/$REPO_NAME/.github/scripts/publish-prerelease.sh"

      - uses: actions/upload-artifact@v7
        if: inputs.update_metadata == true
        name: Upload update metadata fragment.
        with:
          name: update-fragment-${{ steps.matrix.outputs.target }}
          path: dist/update-fragment-${{ steps.matrix.outputs.target }}.json
          retention-days: 1
