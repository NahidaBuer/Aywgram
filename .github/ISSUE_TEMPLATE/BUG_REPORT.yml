name: Bug report
description: Report errors or unexpected behavior.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an AywGram Desktop issue.

        Do not include session strings, tdata, API credentials, proxy secrets,
        message contents, or other authentication data.
  - type: textarea
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behaviour
      placeholder: Tell us what should happen
    validations:
      required: true
  - type: textarea
    attributes:
      label: Actual behaviour
      placeholder: Tell us what happens instead
    validations:
      required: true
  - type: input
    attributes:
      label: Operating system
      description: >
        Your operating system name, version and desktop environment.
        **Don't use kernel version (uname), it's useless.**
    validations:
      required: true
  - type: input
    attributes:
      label: Version of AywGram Desktop
      description: >
        **Don't use 'latest'**, specify actual version.
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Installation source
      multiple: false
      options:
        - This repository's release
        - Self-built from source
        - Third-party package
        - Other
    validations:
      required: true
  - type: input
    attributes:
      label: Crash ID
      description: >
        If you're reporting a crash, please enter the crash ID from the crash reporter
        opening on the next launch after crash.
  - type: textarea
    attributes:
      label: Logs
      description: >
        Remove personal data, session information, proxy secrets, and message contents
        before attaching logs.
      placeholder: Paste sanitized excerpts only (if necessary)
      render: shell
